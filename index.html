<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FEH Collection Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <strong data-i18n="app.title">FEH Collection Tracker</strong>
      <span class="tagline" data-i18n="app.tagline">Catalogue Fire Emblem Heroes</span>
    </div>
    <button id="export-btn" type="button" class="lang" data-i18n="action.export">Export</button>
    <button id="import-btn" type="button" class="lang" data-i18n="action.import">Import</button>
    <input id="import-file" type="file" accept="application/json,.json" hidden>
    <button id="theme-toggle" type="button" class="lang" aria-label="theme">🌓</button>
    <button id="lang-toggle" type="button" class="lang" aria-label="language">EN</button>
  </header>

  <section class="controls">
    <input id="search" type="search" autocomplete="off" data-i18n-attr="placeholder:search.placeholder" placeholder="Rechercher…">
    <div id="filters" class="filters"></div>
    <button type="button" class="reset" id="filter-reset" data-i18n="filter.reset">Réinitialiser les filtres</button>
    <div class="sort" role="group" aria-label="sort">
      <span data-i18n="sort.label">Tri</span>
      <button type="button" class="sortbtn" id="sort-date" data-sortkey="release" data-i18n="sort.byDate">Date</button>
      <button type="button" class="sortbtn" id="sort-name" data-sortkey="name" data-i18n="sort.byName">Nom</button>
    </div>
    <label class="group">
      <input id="group-toggle" type="checkbox">
      <span data-i18n="group.byPerson">Grouper par personnage</span>
    </label>
    <label class="status">
      <span data-i18n="filter.status">Statut</span>
      <select id="status-filter">
        <option value="all" data-i18n="status.all">Tous</option>
        <option value="owned" data-i18n="status.owned">Possédés</option>
        <option value="missing" data-i18n="status.missing">Manquants</option>
      </select>
    </label>
    <span id="collection-count" class="collection-count" aria-live="polite"></span>
  </section>

  <p id="grid-count" class="grid-count" aria-live="polite"></p>
  <main id="grid" class="grid"></main>
  <div id="load-more-sentinel" aria-hidden="true"></div>

  <aside id="detail" class="detail" hidden>
    <button id="detail-close" type="button" class="detail-close" data-i18n="detail.close">Fermer</button>
    <div id="detail-body"></div>
  </aside>

  <footer class="foot">
    <a href="https://github.com/DrZeroes/feh-heroes-tracker">github.com/DrZeroes/feh-heroes-tracker</a>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
